apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator
  template: 
    metadata:
      labels:
        app: aggregator 
    spec: 
      containers: 
        - name: aggregator 
          image: aggregator-service:latest
          imagePullPolicy: Never 
          ports:
            - containerPort: 50051
--- 
apiVersion: v1
kind: Service 
metadata: 
  name: aggregator-service 
spec:
  selector: 
    app: aggregator
  ports:
    - port: 50051
      targetPort: 50051