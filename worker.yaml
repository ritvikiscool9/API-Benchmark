apiVersion: batch/v1
kind: Job
metadata:
  name: worker-job 
spec: 
  template: 
    spec: 
      containers: 
        - name: worker 
          image: worker-service:latest
          imagePullPolicy: Never
          env:
          - name: TARGET_URL
            value: "TARGET_URL_PLACEHOLDER"
          - name: REQUEST_COUNT
            value: "REQUEST_COUNT_PLACEHOLDER"
      restartPolicy: Never